<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AryaCode 3D</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #050608;
}

body {

    min-height: 100vh;

    background: #050608;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding: 40px 20px 80px;
}


/* =========================
   ARYACODE
========================= */

.brand {

    text-align: center;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: 6px;

    margin-bottom: 50px;
}

.brand span {

    font-weight: 300;

    opacity: 0.4;
}


/* =========================
   MODEL SECTIONS
========================= */

.models {

    width: 100%;

    max-width: 900px;

    margin: auto;

    display: flex;

    flex-direction: column;

    gap: 45px;
}


/* =========================
   MODEL
========================= */

.model-section {

    width: 100%;

    text-align: center;
}


.model-title {

    color:
        rgba(255,255,255,0.45);

    font-size: 10px;

    letter-spacing: 4px;

    margin-bottom: 14px;

    text-transform: uppercase;
}


.model-box {

    width: 650px;

    height: 500px;

    max-width: 100%;

    margin: auto;

    position: relative;

    overflow: hidden;

    border-radius: 18px;

    border: 1px solid #252a30;

    background: #0c0f12;
}


.viewer {

    width: 100%;

    height: 100%;
}


.viewer canvas {

    display: block;

    width: 100%;

    height: 100%;
}


.model-number {

    position: absolute;

    left: 20px;

    bottom: 18px;

    z-index: 5;

    color:
        rgba(255,255,255,0.28);

    font-size: 9px;

    letter-spacing: 3px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {

        padding:
            30px 15px 60px;

    }

    .brand {

        margin-bottom: 35px;

    }

    .model-box {

        height: 420px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ARYACODE
========================= -->

<div class="brand">

    ARYA<span>CODE</span>

</div>



<!-- =========================
     MODELS
========================= -->

<div class="models">


    <!-- MODEL 01 -->

    <section class="model-section">

        <div class="model-title">

            01

        </div>

        <div class="model-box">

            <div
                id="viewer1"
                class="viewer">
            </div>

            <div class="model-number">

                ARYACODE 01

            </div>

        </div>

    </section>



    <!-- MODEL 02 -->

    <section class="model-section">

        <div class="model-title">

            02

        </div>

        <div class="model-box">

            <div
                id="viewer2"
                class="viewer">
            </div>

            <div class="model-number">

                ARYACODE 02

            </div>

        </div>

    </section>


</div>



<!-- =========================
     THREE.JS
========================= -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>



<script type="module">


import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";



/* =========================================
   CREATE A MODEL VIEWER
========================================= */

function createViewer(
    containerId,
    modelFile
) {


    const container =
        document.getElementById(
            containerId
        );


    /* =========================
       SCENE
    ========================= */

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x0c0f12
        );


    /* =========================
       CAMERA
    ========================= */

    const camera =
        new THREE.PerspectiveCamera(

            35,

            container.clientWidth /
            container.clientHeight,

            0.01,

            10000

        );


    /* =========================
       RENDERER
    ========================= */

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        container.clientWidth,

        container.clientHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.15;


    container.appendChild(
        renderer.domElement
    );



    /* =========================
       LIGHTING
    ========================= */

    const ambient =
        new THREE.AmbientLight(

            0xffffff,

            1.5

        );


    scene.add(
        ambient
    );


    const key =
        new THREE.DirectionalLight(

            0xffffff,

            4

        );


    key.position.set(
        5,
        8,
        10
    );


    scene.add(
        key
    );


    const fill =
        new THREE.DirectionalLight(

            0xcbd5e1,

            2.5

        );


    fill.position.set(
        -6,
        3,
        5
    );


    scene.add(
        fill
    );


    const rim =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    rim.position.set(
        0,
        5,
        -10
    );


    scene.add(
        rim
    );



    /* =========================
       CONTROLS
    ========================= */

    const controls =
        new OrbitControls(

            camera,

            renderer.domElement

        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.06;


    controls.enablePan =
        false;


    controls.autoRotate =
        true;


    controls.autoRotateSpeed =
        0.4;


    /*
       Prevent zooming through
       the model.
    */

    controls.minDistance =
        0.5;


    controls.maxDistance =
        1000;



    /* =========================
       LOAD MODEL
    ========================= */

    const loader =
        new GLTFLoader();


    loader.load(

        modelFile,


        function(gltf) {


            const model =
                gltf.scene;


            /* =====================
               MATERIAL + EDGES
            ===================== */

            model.traverse(

                function(object) {


                    if (!object.isMesh)
                        return;


                    object.material =
                        new THREE.MeshStandardMaterial({

                            color:
                                0x555d66,

                            metalness:
                                0.15,

                            roughness:
                                0.48

                        });


                    /*
                       CAD EDGE LINES
                    */

                    const edges =
                        new THREE.EdgesGeometry(

                            object.geometry,

                            15

                        );


                    const edgeMaterial =
                        new THREE.LineBasicMaterial({

                            color:
                                0xe5e7eb,

                            transparent:
                                true,

                            opacity:
                                0.7

                        });


                    const lines =
                        new THREE.LineSegments(

                            edges,

                            edgeMaterial

                        );


                    object.add(
                        lines
                    );

                }

            );



            /* =====================
               CENTER MODEL
            ===================== */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(

                    new THREE.Vector3()

                );


            model.position.sub(
                center
            );


            scene.add(
                model
            );



            /* =====================
               FIT MODEL TO BOX
            ===================== */

            const sphere =
                new THREE.Sphere();


            const finalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            finalBox.getBoundingSphere(
                sphere
            );


            const radius =
                sphere.radius;


            const fov =
                THREE.MathUtils.degToRad(
                    camera.fov
                );


            /*
               Proper camera distance
               based on actual model size.
            */

            const distance =

                radius /
                Math.sin(
                    fov / 2
                );


            const finalDistance =

                distance * 1.6;


            camera.position.set(

                finalDistance,

                finalDistance * 0.55,

                finalDistance

            );


            camera.lookAt(
                0,
                0,
                0
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();

        },


        undefined,


        function(error) {

            console.error(

                "Could not load " +
                modelFile,

                error

            );

        }

    );



    /* =========================
       RESIZE
    ========================= */

    function resize() {


        camera.aspect =

            container.clientWidth /
            container.clientHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            container.clientWidth,

            container.clientHeight

        );

    }


    window.addEventListener(
        "resize",
        resize
    );



    /* =========================
       ANIMATION
    ========================= */

    function animate() {

        requestAnimationFrame(
            animate
        );


        controls.update();


        renderer.render(
            scene,
            camera
        );

    }


    animate();

}



/* =========================================
   START BOTH MODELS
========================================= */

createViewer(
    "viewer1",
    "sih.glb"
);


createViewer(
    "viewer2",
    "sih2.glb"
);


</script>

</body>

</html>
