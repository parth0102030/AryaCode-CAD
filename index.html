<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AryaCode 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050608;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
        }

        /* ARYACODE */

        .brand {
            position: absolute;
            top: 32px;
            left: 40px;
            z-index: 10;

            font-size: 17px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
        }

        .brand span {
            font-weight: 300;
            opacity: 0.45;
        }

        /* MODEL VIEW */

        #viewer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* SMALL LABEL */

        .label {
            position: absolute;
            bottom: 32px;
            left: 40px;
            z-index: 10;

            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
        }

        /* LOADING */

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255,255,255,0.35);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;

            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>

<body>

    <div class="brand">
        ARYA<span>CODE</span>
    </div>

    <div class="loading" id="loading">
        Loading 3D
    </div>

    <div id="viewer"></div>

    <div class="label">
        3D MODEL
    </div>


    <!-- THREE.JS -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <script type="module">

        import * as THREE from "three";

        import {
            GLTFLoader
        } from "three/addons/loaders/GLTFLoader.js";

        import {
            OrbitControls
        } from "three/addons/controls/OrbitControls.js";


        /* -------------------------
           SETUP
        ------------------------- */

        const container =
            document.getElementById("viewer");

        const loading =
            document.getElementById("loading");


        const scene =
            new THREE.Scene();

        scene.background =
            new THREE.Color(0x050608);


        /* -------------------------
           CAMERA
        ------------------------- */

        const camera =
            new THREE.PerspectiveCamera(
                40,
                window.innerWidth /
                window.innerHeight,
                0.01,
                1000
            );


        /* -------------------------
           RENDERER
        ------------------------- */

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true,
                alpha: false
            });

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;

        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;

        renderer.toneMappingExposure =
            1.15;

        container.appendChild(
            renderer.domElement
        );


        /* -------------------------
           LIGHTING
        ------------------------- */

        const ambient =
            new THREE.AmbientLight(
                0xffffff,
                1.5
            );

        scene.add(ambient);


        const keyLight =
            new THREE.DirectionalLight(
                0xffffff,
                4
            );

        keyLight.position.set(
            5,
            8,
            8
        );

        scene.add(keyLight);


        const fillLight =
            new THREE.DirectionalLight(
                0xbfc9d8,
                2.5
            );

        fillLight.position.set(
            -6,
            3,
            4
        );

        scene.add(fillLight);


        const rimLight =
            new THREE.DirectionalLight(
                0xffffff,
                3
            );

        rimLight.position.set(
            0,
            4,
            -8
        );

        scene.add(rimLight);


        /* -------------------------
           CONTROLS
        ------------------------- */

        const controls =
            new OrbitControls(
                camera,
                renderer.domElement
            );

        controls.enableDamping = true;

        controls.dampingFactor = 0.06;

        controls.enablePan = false;

        controls.autoRotate = true;

        controls.autoRotateSpeed = 1.2;

        controls.minDistance = 0.5;

        controls.maxDistance = 20;


        /* -------------------------
           LOAD CAD MODEL
        ------------------------- */

        const loader =
            new GLTFLoader();


        loader.load(

            "sih.glb",

            function(gltf) {

                const model =
                    gltf.scene;


                /* -------------------------
                   MODEL MATERIAL
                ------------------------- */

                model.traverse(
                    function(object) {

                        if (!object.isMesh)
                            return;


                        object.material =
                            new THREE.MeshStandardMaterial({

                                color:
                                    new THREE.Color(
                                        0x8d949c
                                    ),

                                metalness:
                                    0.25,

                                roughness:
                                    0.42
                            });


                        /* -------------------------
                           CAD EDGES
                        ------------------------- */

                        const edges =
                            new THREE.EdgesGeometry(
                                object.geometry,
                                25
                            );


                        const edgeMaterial =
                            new THREE.LineBasicMaterial({

                                color:
                                    0x16191d,

                                transparent:
                                    true,

                                opacity:
                                    0.9
                            });


                        const edgeLines =
                            new THREE.LineSegments(
                                edges,
                                edgeMaterial
                            );


                        object.add(
                            edgeLines
                        );

                    }
                );


                /* -------------------------
                   CENTER MODEL
                ------------------------- */

                const box =
                    new THREE.Box3()
                        .setFromObject(model);


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                model.position.sub(
                    center
                );


                scene.add(model);


                /* -------------------------
                   CAMERA FIT
                ------------------------- */

                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const maxDimension =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                const distance =
                    maxDimension * 2.0;


                camera.position.set(
                    distance * 0.8,
                    distance * 0.45,
                    distance
                );


                camera.lookAt(
                    0,
                    0,
                    0
                );


                controls.target.set(
                    0,
                    0,
                    0
                );


                controls.update();


                /* -------------------------
                   HIDE LOADING
                ------------------------- */

                loading.style.opacity = "0";

            },


            undefined,


            function(error) {

                console.error(
                    "Model loading error:",
                    error
                );

                loading.textContent =
                    "MODEL ERROR";

            }

        );


        /* -------------------------
           RESIZE
        ------------------------- */

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /* -------------------------
           ANIMATION
        ------------------------- */

        function animate() {

            requestAnimationFrame(
                animate
            );


            controls.update();


            renderer.render(
                scene,
                camera
            );

        }


        animate();

    </script>

</body>
</html>
