<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AryaCode 3D</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background: #050608;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =========================
   MAIN
========================= */

.page {

    width: 100%;

    max-width: 900px;

    padding: 50px 30px;

    text-align: center;

}


/* =========================
   BRAND
========================= */

.brand {

    font-size: 18px;

    font-weight: 700;

    letter-spacing: 6px;

    margin-bottom: 35px;

}

.brand span {

    font-weight: 300;

    opacity: 0.4;

}


/* =========================
   3D MODEL BOX
========================= */

.model-box {

    width: 650px;

    height: 500px;

    max-width: 100%;

    margin: auto;

    background: #0c0f12;

    border: 1px solid #252a30;

    border-radius: 18px;

    overflow: hidden;

    position: relative;

}


/* =========================
   THREE VIEWER
========================= */

#viewer {

    width: 100%;

    height: 100%;

}

canvas {

    display: block;

}


/* =========================
   SMALL LABEL
========================= */

.label {

    position: absolute;

    bottom: 18px;

    left: 22px;

    color:
        rgba(255,255,255,0.3);

    font-size: 9px;

    letter-spacing: 3px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .model-box {

        height: 420px;

    }

}

</style>

</head>


<body>


<div class="page">


    <div class="brand">

        ARYA<span>CODE</span>

    </div>


    <div class="model-box">

        <div id="viewer"></div>

        <div class="label">

            3D MODEL

        </div>

    </div>


</div>



<script type="importmap">

{

    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }

}

</script>



<script type="module">


import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";



/* =========================
   CONTAINER
========================= */

const container =
    document.getElementById(
        "viewer"
    );



/* =========================
   SCENE
========================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x0c0f12
    );



/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(

        35,

        container.clientWidth /
        container.clientHeight,

        0.01,

        1000

    );


camera.position.set(
    7,
    5,
    9
);



/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(

    container.clientWidth,

    container.clientHeight

);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


container.appendChild(
    renderer.domElement
);



/* =========================
   LIGHTS
========================= */

const ambient =
    new THREE.AmbientLight(

        0xffffff,

        1.5

    );


scene.add(
    ambient
);


const key =
    new THREE.DirectionalLight(

        0xffffff,

        4

    );


key.position.set(
    5,
    8,
    10
);


scene.add(
    key
);


const fill =
    new THREE.DirectionalLight(

        0xcbd5e1,

        2.5

    );


fill.position.set(
    -6,
    3,
    5
);


scene.add(
    fill
);



/* =========================
   CONTROLS
========================= */

const controls =
    new OrbitControls(

        camera,

        renderer.domElement

    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.06;


controls.enablePan =
    false;


controls.autoRotate =
    true;


controls.autoRotateSpeed =
    0.4;


/*
   IMPORTANT:
   prevents zooming
   ridiculously close.
*/

controls.minDistance =
    4;


controls.maxDistance =
    20;



/* =========================
   LOAD MODEL
========================= */

const loader =
    new GLTFLoader();


loader.load(

    "sih.glb",


    function(gltf) {


        const model =
            gltf.scene;


        /* =====================
           MATERIAL
        ===================== */

        model.traverse(

            function(object) {


                if (!object.isMesh)
                    return;


                object.material =
                    new THREE.MeshStandardMaterial({

                        color:
                            0x555d66,

                        metalness:
                            0.15,

                        roughness:
                            0.48

                    });


                /* =================
                   EDGES
                ================= */

                const edges =
                    new THREE.EdgesGeometry(

                        object.geometry,

                        15

                    );


                const edgeMaterial =
                    new THREE.LineBasicMaterial({

                        color:
                            0xe5e7eb,

                        transparent:
                            true,

                        opacity:
                            0.7

                    });


                const lines =
                    new THREE.LineSegments(

                        edges,

                        edgeMaterial

                    );


                object.add(
                    lines
                );

            }

        );



        /* =====================
           CENTER MODEL
        ===================== */

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        model.position.sub(
            center
        );


        scene.add(
            model
        );



        /* =====================
           FIXED CAMERA
        ===================== */

        camera.position.set(

            7,

            4.5,

            9

        );


        camera.lookAt(
            0,
            0,
            0
        );


        controls.target.set(
            0,
            0,
            0
        );


        controls.update();

    },


    undefined,


    function(error) {

        console.error(
            "Could not load model:",
            error
        );

    }

);



/* =========================
   RESIZE
========================= */

window.addEventListener(

    "resize",

    function() {


        camera.aspect =

            container.clientWidth /
            container.clientHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            container.clientWidth,

            container.clientHeight

        );

    }

);



/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>

</html>
